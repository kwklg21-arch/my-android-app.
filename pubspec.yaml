name: folio_reader
description: Offline-first customizable e-reader starter for Android and Flutter.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.7
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  flutter_tts: ^4.2.2
  archive: ^3.6.1
  xml: ^6.5.0
  syncfusion_flutter_pdf: ^28.1.33
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
